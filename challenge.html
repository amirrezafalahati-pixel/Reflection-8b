```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>The Challenge</title>


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #111111 55%,
            #070707 100%
        );

    color: #e7e3d8;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow-x: hidden;
}


/* =========================
   CONTAINER
========================= */

.container {

    width: min(90%, 720px);

    min-height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 55px 20px;
}


.content {
    width: 100%;
}


/* =========================
   SYMBOLS
========================= */

.symbols {

    font-size: 18px;

    letter-spacing: 13px;

    color: #77746c;

    margin-bottom: 32px;
}


/* =========================
   TITLE
========================= */

h1 {

    margin: 0;

    font-size:
        clamp(30px, 8vw, 52px);

    font-weight: normal;

    letter-spacing: 6px;

    color: #e9e5dc;
}


/* =========================
   DIVIDER
========================= */

.line {

    width: 70px;

    height: 1px;

    background: #77746c;

    margin: 27px auto;

    opacity: .7;
}


/* =========================
   INTRO
========================= */

.intro {

    max-width: 560px;

    margin: 0 auto;

    color: #9f9b93;

    font-size: 15px;

    line-height: 2;

    font-style: italic;
}


/* =========================
   CHALLENGE
========================= */

.challenge {

    margin-top: 45px;
}


/* =========================
   LABEL
========================= */

.label {

    font-size: 11px;

    letter-spacing: 3px;

    color: #77746c;

    margin-bottom: 15px;
}


/* =========================
   INPUT
========================= */

input {

    width: min(100%, 390px);

    padding: 15px 18px;

    background: transparent;

    border: 1px solid #55524c;

    color: #e7e3d8;

    font-family: Georgia, serif;

    font-size: 15px;

    text-align: center;

    letter-spacing: 2px;

    outline: none;

    transition:
        border-color .3s ease;
}


input:focus {

    border-color: #aaa69d;
}


input::placeholder {

    color: #57544e;

    letter-spacing: 2px;
}


/* =========================
   DECODE BUTTON
========================= */

.decode {

    margin-top: 16px;

    padding: 13px 32px;

    background: transparent;

    border: 1px solid #66635d;

    color: #dedad0;

    font-family: Georgia, serif;

    font-size: 13px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        background .35s ease,
        color .35s ease,
        transform .25s ease;
}


.decode:hover {

    background: #dedad0;

    color: #101010;

    transform: translateY(-2px);
}


/* =========================
   MESSAGE
========================= */

.message {

    min-height: 24px;

    margin-top: 18px;

    font-size: 13px;

    color: #77746c;
}


/* =========================
   HINT BUTTON
========================= */

.hint-trigger {

    margin-top: 27px;

    background: none;

    border: none;

    color: #625f58;

    font-family: Georgia, serif;

    font-size: 11px;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        color .3s ease;
}


.hint-trigger:hover {

    color: #aaa69d;
}


/* =========================
   HINT BOX
========================= */

.hint-box {

    display: none;

    max-width: 520px;

    margin: 22px auto 0;

    padding: 22px 20px;

    border-top: 1px solid #373631;

    border-bottom: 1px solid #373631;

    animation:
        fadeIn .6s ease forwards;
}


.hint-box.show {

    display: block;
}


/* =========================
   HINT NUMBER
========================= */

.hint-number {

    font-size: 10px;

    letter-spacing: 3px;

    color: #66635d;

    margin-bottom: 10px;
}


/* =========================
   HINT TEXT
========================= */

.hint-text {

    color: #99958d;

    font-size: 13px;

    line-height: 1.9;

    font-style: italic;
}


/* =========================
   NEXT HINT
========================= */

.more-hint {

    margin-top: 18px;

    background: none;

    border: none;

    color: #77746c;

    font-family: Georgia, serif;

    font-size: 11px;

    letter-spacing: 1.5px;

    cursor: pointer;
}


.more-hint:hover {

    color: #aaa69d;
}


/* =========================
   RETURN
========================= */

.return {

    display: inline-block;

    margin-top: 40px;

    color: #625f58;

    font-size: 11px;

    letter-spacing: 2px;

    text-decoration: none;

    transition:
        color .3s ease;
}


.return:hover {

    color: #aaa69d;
}


/* =========================
   FOOTER
========================= */

.footer {

    position: fixed;

    bottom: 16px;

    left: 0;

    width: 100%;

    text-align: center;

    font-size: 10px;

    letter-spacing: 3px;

    color: #4f4d48;
}


/* =========================
   ANIMATION
========================= */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(10px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    h1 {

        letter-spacing: 4px;
    }

    .symbols {

        letter-spacing: 8px;
    }

    .intro {

        font-size: 14px;
    }

}

</style>

</head>


<body>


<div class="container">


<div class="content">


<!-- HEADER -->

<div class="symbols">
ϟ △ ⊙ ∴ □
</div>


<h1>
THE CHALLENGE
</h1>


<div class="line"></div>


<div class="intro">

The key is already there.

<br>

You only have to notice it.

</div>



<!-- CHALLENGE -->

<div class="challenge">


<div class="label">
ENTER THE KEY
</div>


<input
    id="codeInput"
    type="text"
    placeholder="TYPE YOUR ANSWER"
    autocomplete="off"
>


<br>


<button
    class="decode"
    onclick="checkCode()"
>

DECODE

</button>


<div
    id="message"
    class="message"
>
</div>


</div>



<!-- HINT BUTTON -->

<button
    id="hintTrigger"
    class="hint-trigger"
    onclick="showNextHint()"
>

Need a little help?

</button>



<!-- HINT -->

<div
    id="hintBox"
    class="hint-box"
>


<div
    id="hintNumber"
    class="hint-number"
>
</div>


<div
    id="hintText"
    class="hint-text"
>
</div>


<button
    id="moreHint"
    class="more-hint"
    onclick="showNextHint()"
>

I NEED ANOTHER HINT

</button>


</div>



<!-- RETURN TO SCENARIO -->

<a
    href="Reflection 8b.pdf"
    target="_blank"
    class="return"
>

↶ RETURN TO THE SCENARIO

</a>


</div>

</div>



<div class="footer">

THINK · QUESTION · REFLECT

</div>



<script>

/* =====================================================
   FINAL KEY
===================================================== */

const correctKey =
    "UNDERSTANDING IS NOT THE FINAL STOP";


/* =====================================================
   HINTS

   HINT 1 = VERY SUBTLE
   HINT 2 = MORE DIRECT
   HINT 3 = FINAL GUIDANCE
===================================================== */

const hints = [

    {
        number: "HINT 01 · LOOK AGAIN",

        text:
        "Go back to the scenario. " +
        "Read it once more, but this time " +
        "pay attention to the details you " +
        "may have passed over."
    },

    {
        number: "HINT 02 · LOOK CLOSER",

        text:
        "The key is not something new. " +
        "It comes from something you have " +
        "already seen in the scenario. " +
        "Look for what seems deliberately placed."
    },

    {
        number: "HINT 03 · THE LAST STEP",

        text:
        "You are looking for a phrase, not a symbol. " +
        "Think about the meaning behind the journey " +
        "of the scenario. The answer is closer than it seems."
    }

];


/* =====================================================
   HINT STATE
===================================================== */

let currentHint = 0;


/* =====================================================
   SHOW NEXT HINT
===================================================== */

function showNextHint() {

    const hintBox =
        document.getElementById("hintBox");

    const hintNumber =
        document.getElementById("hintNumber");

    const hintText =
        document.getElementById("hintText");

    const moreHint =
        document.getElementById("moreHint");

    const hintTrigger =
        document.getElementById("hintTrigger");


    if (currentHint < hints.length) {

        hintNumber.innerText =
            hints[currentHint].number;

        hintText.innerText =
            hints[currentHint].text;

        hintBox.classList.add("show");

        currentHint++;

    }


    /* After the third hint */

    if (currentHint >= hints.length) {

        moreHint.style.display =
            "none";

        hintTrigger.innerText =
            "ALL HINTS REVEALED";

        hintTrigger.disabled =
            true;

        hintTrigger.style.cursor =
            "default";

    }

}


/* =====================================================
   NORMALIZE ANSWER

   Removes extra spaces and ignores
   upper/lower case.
===================================================== */

function normalizeText(text) {

    return text
        .trim()
        .replace(/\s+/g, " ")
        .toUpperCase();

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkCode() {

    const input =
        document
        .getElementById("codeInput")
        .value;


    const message =
        document
        .getElementById("message");


    const normalizedInput =
        normalizeText(input);


    const normalizedKey =
        normalizeText(correctKey);


    if (
        normalizedInput ===
        normalizedKey
    ) {

        message.innerText =
            "The lock opens.";


        message.style.color =
            "#c5c0b5";


        setTimeout(function() {

            window.location.href =
                "Main Reflection 8b.pdf";

        }, 900);

    }

    else {

        message.innerText =
            "Not quite. Look again.";

        message.style.color =
            "#77746c";

    }

}


/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

document
    .getElementById("codeInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                checkCode();

            }

        }
    );

</script>


</body>

</html>
```
